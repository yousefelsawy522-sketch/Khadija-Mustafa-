<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Her Special Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* ألوان أطفال مبهجة جداً */
        :root {
            --bg-color: #87ceeb; /* لبني فاتح */
            --bg-gradient-center: #ffb6c1; /* بينك بناتي */
            --text-main: #2c3e50; /* كحلي غامق عشان يبقى مقروء */
            --text-muted: #e74c3c; /* أحمر */
            --primary: #ff1493; /* بينك فاقع */
            --secondary: #ff8c00; /* برتقالي */
            --gold: #ffd700; /* أصفر دهبي */
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, var(--bg-gradient-center) 0%, var(--bg-color) 100%);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            text-align: center;
        }

        /* بلالين وأشكال بتطير في الخلفية */
        .stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
        }
        .floating-item {
            position: absolute; opacity: 0.8;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        /* نظام الشاشات والانتقال الناعم */
        .section {
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; width: 100%;
            position: absolute; top: 0; left: 0;
            opacity: 0; pointer-events: none; transition: opacity 1s ease-in-out;
            z-index: 1; padding: 20px 0; box-sizing: border-box;
        }
        .section.active {
            opacity: 1; pointer-events: auto; position: relative; z-index: 10;
        }

        /* زراير مدورة وألوانها فاقعة ومفرحة */
        .btn-outline {
            background: var(--primary);
            border: 3px solid white;
            color: white; padding: 15px 40px; border-radius: 50px;
            font-family: 'Cairo', sans-serif; font-size: 1.1rem; font-weight: 800;
            cursor: pointer; letter-spacing: 2px; transition: 0.4s;
            text-transform: uppercase; margin-top: 30px; position: relative; z-index: 20;
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.5);
        }
        .btn-outline:hover { background: var(--secondary); transform: scale(1.1) translateY(-5px); }

        /* النصوص */
        .subtitle {
            font-size: 1.2rem; font-weight: 800;
            letter-spacing: 2px; color: var(--primary); text-transform: uppercase;
            margin-bottom: 20px; position: relative; z-index: 20;
            background: rgba(255,255,255,0.7); padding: 5px 15px; border-radius: 20px;
        }
        .main-title { 
            font-family: 'Playfair Display', serif; font-size: 4.5rem; margin: 10px 0; 
            position: relative; z-index: 20; color: white;
            text-shadow: 2px 2px 0 var(--primary), -2px -2px 0 var(--secondary), 0 5px 10px rgba(0,0,0,0.3); 
        }

        /* حقل الباسورد */
        .pass-input {
            background: white; border: 3px solid var(--primary);
            color: var(--text-main); padding: 15px; border-radius: 20px; text-align: center;
            font-family: 'Cairo', sans-serif; font-size: 1.2rem; font-weight: bold; outline: none;
            width: 250px; margin-top: 20px; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .pass-input:focus { border-color: var(--secondary); transform: scale(1.05); }

        /* حركة الهدية */
        .gift-icon {
            font-size: 8rem; margin: 20px 0; cursor: pointer;
            animation: bounceGift 1.5s infinite; transition: 0.3s;
        }
        .gift-icon:hover { transform: scale(1.2); }
        @keyframes bounceGift {
            0%, 100% { transform: translateY(0); filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2)); }
            50% { transform: translateY(-25px); filter: drop-shadow(0 15px 15px rgba(0,0,0,0.3)); }
        }

        /* صور الجنب (الصفحة الأولى) */
        .side-photo {
            position: absolute; background: white; padding: 5px 5px 20px 5px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); border-radius: 10px;
            width: 80px; z-index: 5; opacity: 0.9;
            animation: floatSide 3s infinite ease-in-out alternate;
            border: 2px solid var(--primary);
        }
        .side-photo img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 5px; }
        
        .sp-1 { top: 10%; left: 5%; --rot: -15deg; animation-delay: 0s; }
        .sp-2 { top: 35%; left: 10%; --rot: 10deg; animation-delay: 1s; }
        .sp-3 { top: 60%; left: 5%; --rot: -5deg; animation-delay: 0.5s; }
        .sp-4 { top: 85%; left: 10%; --rot: 12deg; animation-delay: 1.5s; }
        
        .sp-5 { top: 15%; right: 5%; --rot: 15deg; animation-delay: 0.2s; }
        .sp-6 { top: 40%; right: 8%; --rot: -10deg; animation-delay: 1.2s; }
        .sp-7 { top: 65%; right: 5%; --rot: 8deg; animation-delay: 0.8s; }
        .sp-8 { top: 90%; right: 8%; --rot: -12deg; animation-delay: 1.8s; }

        @keyframes floatSide {
            0% { transform: translateY(0) rotate(var(--rot)); }
            100% { transform: translateY(-20px) rotate(calc(var(--rot) + 10deg)); }
        }
        
        @media(max-width: 500px) { .side-photo { width: 65px; } }

        /* شبكة الذكريات (16 صورة) */
        .polaroid-grid {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;
            max-width: 800px; margin: 0 auto; padding: 20px;
        }
        .polaroid {
            background: white; padding: 8px 8px 30px 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); border-radius: 10px;
            width: calc(25% - 20px); min-width: 90px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid var(--gold);
        }
        .polaroid img { width: 100%; aspect-ratio: 1/1.1; object-fit: cover; border-radius: 5px; }
        
        .polaroid:hover {
            transform: scale(1.2) rotate(0deg) !important;
            z-index: 100; box-shadow: 0 15px 30px rgba(255, 20, 147, 0.5);
        }

        .hidden-btn { opacity: 0; pointer-events: none; transition: 1.5s; }
        .hidden-btn.show { opacity: 1; pointer-events: auto; }

        /* زرار الموسيقى */
        #music-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            background: white; border: 3px solid var(--primary);
            border-radius: 50%; width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-size: 1.5rem; display: none; transition: 0.3s;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }
        #music-toggle.playing { background: var(--primary); border-color: white; }

        /* تنسيق الرسالة الآلية */
        .typewriter-title { text-align: center; color: var(--primary); font-weight: 800; font-size: 2rem; margin-bottom: 20px; text-shadow: 1px 1px 0 white; }
        .typewriter-body { text-align: right; font-weight: 600; font-size: 1.2rem; }
    </style>
</head>
<body>

    <audio id="bgMusic" src="music.mp3" loop></audio>
    
    <div class="stars-container" id="stars"></div>
    <div id="music-toggle" onclick="toggleMusic()">🎵</div>

    <div id="sec-password" class="section active">
        <p class="subtitle">🎈 عيد ميلاد العفريتة الصغيرة 🎈</p>
        <h1 class="main-title">Her Special Day</h1>
        <h1 class="main-title" style="font-size: 3rem;">is Coming</h1>
        
        <p style="font-family: 'Cairo', sans-serif; font-size: 1.2rem; color: var(--text-main); margin-top: 25px; font-weight: bold;">
            اكتبي تاريخ ميلاد العسل القمر.. 🗝️
